<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16357A">
<title>Lançar</title>
<style>
  :root{ --azul:#2563B9; --azul-esc:#1C4E96; --bg:#16357A; --verde:#16823C; --vermelho:#C13131;
         --card:#fff; --borda:#D7DEE9; --txt:#26303D; --txt2:#6B7686; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);
       min-height:100vh;padding:18px;color:var(--txt)}
  .wrap{max-width:440px;margin:0 auto}
  .head{display:flex;align-items:center;gap:10px;color:#fff;margin:6px 2px 16px}
  .logo{width:34px;height:34px;background:var(--verde);border-radius:9px;display:flex;
        align-items:center;justify-content:center;font-weight:800;font-size:18px;
        box-shadow:0 4px 12px rgba(22,130,60,0.4);
        transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        user-select:none;cursor:pointer}
  .logo:hover, .logo.bounce {
    animation: logoBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes logoBounce {
    0% { transform: scale(1) rotate(0deg); }
    30% { transform: scale(1.25) rotate(-10deg); }
    60% { transform: scale(0.9) rotate(5deg); }
    80% { transform: scale(1.1) rotate(-2deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .head h1{font-size:19px;font-weight:600}
  .card{background:var(--card);border-radius:16px;padding:18px;
        box-shadow:0 8px 28px rgba(0,0,0,.2);
        animation: cardEntrance 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;}
  @keyframes cardEntrance {
    0% { opacity: 0; transform: translateY(18px) scale(0.97); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  label{display:block;font-size:13px;font-weight:600;color:var(--txt2);margin:14px 2px 6px}
  label:first-child{margin-top:0}
  input[type=date]{width:100%;height:50px;border:1.5px solid var(--borda);border-radius:11px;
        padding:0 14px;font-size:17px;font-family:inherit;color:var(--txt);
        background:#fff;outline:none;appearance:none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;}
  input[type=date]:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(37,99,185,0.15)}

  /* ---- campo busca descricao ---- */
  .desc-wrap{position:relative}
  .desc-row{display:flex;width:100%}
  #descSearch{flex:1;min-width:0;height:50px;border:1.5px solid var(--borda);border-radius:11px 0 0 11px;
        border-right:none;padding:0 14px;font-size:17px;font-family:inherit;
        color:var(--txt);background:#fff;outline:none;appearance:none;
        transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;}
  #descSearch:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(37,99,185,0.12)}
  #descSearch.ok{border-color:var(--verde);background:#F0FAF4}
  #descSearch.err{border-color:var(--vermelho);background:#FEF0F0}
  .desc-clear{width:46px;height:50px;border:1.5px solid var(--borda);border-left:none;
        border-radius:0 11px 11px 0;background:#F7F9FC;color:var(--txt2);font-size:20px;
        cursor:pointer;display:flex;align-items:center;justify-content:center;
        flex-shrink:0;user-select:none;
        transition:background .2s,border-color .2s,color .2s,transform .2s cubic-bezier(0.34, 1.56, 0.64, 1)}
  .desc-clear:active{transform:scale(0.82) rotate(-20deg);}
  .desc-row.state-ok .desc-clear,#descClear.clear-ok{border-color:var(--verde) !important;background:#E6F7ED !important;color:var(--verde) !important}
  .desc-row.state-err .desc-clear,#descClear.clear-err{border-color:var(--vermelho) !important;background:#FEF0F0 !important;color:var(--vermelho) !important}
  .desc-hint{font-size:11px;margin:3px 2px 0;min-height:0;height:14px;line-height:14px;font-weight:500;overflow:hidden;transition:color 0.2s ease}
  .desc-hint.ok{color:var(--verde)} .desc-hint.err{color:var(--vermelho)} .desc-hint.info{color:var(--txt2)}

  /* ---- dropdown suave e perfeitamente alinhado ---- */
  .drop{position:absolute;top:52px;left:0;width:100%;background:#fff;border:1.5px solid var(--azul);
        border-radius:12px;box-shadow:0 8px 28px rgba(22,53,122,.18);
        max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;
        z-index:9999;display:none;box-sizing:border-box;}
  .drop.open{display:block}
  .drop-spring{
    animation: dropSmooth 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes dropSmooth {
    0% { opacity: 0; transform: translateY(-6px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .drop-item{padding:14px 16px;font-size:16px;border-bottom:1px solid #F0F3F8;
        cursor:pointer;user-select:none;-webkit-user-select:none;
        transition: background 0.15s ease, color 0.15s ease, padding-left 0.15s ease;}
  .drop-item:last-child{border-bottom:none}
  .drop-item:hover, .drop-item.active{background:#F0F6FF;color:var(--azul);padding-left:20px;}
  .drop-item:active{background:var(--azul);color:#fff;}
  .drop-item em{font-style:normal;font-weight:700}
  .drop-empty{padding:16px;color:var(--txt2);font-size:14px;text-align:center}

  /* ---- valor com animacao ao digitar (z-index garante RS visivel) ---- */
  .moeda{position:relative}
  .moeda span{position:absolute;left:14px;top:50%;transform:translateY(-50%);
        color:var(--txt2);font-size:16px;font-weight:600;
        z-index:10;pointer-events:none;
        transition:color 0.2s ease;}
  .moeda input{width:100%;height:50px;border:1.5px solid var(--borda);border-radius:11px;
        padding:0 14px 0 42px;font-size:22px;font-family:inherit;color:var(--txt);
        background:#fff;outline:none;appearance:none;letter-spacing:.5px;
        position:relative;z-index:1;
        transition:border-color .2s,background .2s,color .2s,box-shadow .2s,transform .15s ease}
  .moeda input:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(37,99,185,0.15)}
  .moeda input.ativo{border-color:var(--azul);background:#F0F6FF}

  /* Keyframe bounce pop suave */
  @keyframes bouncePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .bounce-pop {
    animation: bouncePop 0.18s ease-out;
  }

  @keyframes symbolBounce {
    0% { transform: translateY(-50%) scale(1); }
    50% { transform: translateY(-50%) scale(1.22); color: var(--azul); }
    100% { transform: translateY(-50%) scale(1); }
  }
  .symbol-bounce {
    animation: symbolBounce 0.2s ease-out;
  }

  @keyframes clearSpin {
    0% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.25) rotate(180deg); color: var(--vermelho); }
    100% { transform: scale(1) rotate(360deg); }
  }
  .clear-spin {
    animation: clearSpin 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Botao interativo */
  button{width:100%;height:54px;border:none;border-radius:13px;
         background:linear-gradient(135deg, var(--azul) 0%, var(--azul-esc) 100%);
         color:#fff;font-size:17px;font-weight:600;font-family:inherit;margin-top:18px;
         cursor:pointer;position:relative;overflow:hidden;
         box-shadow:0 4px 16px rgba(37,99,185,0.35);
         transition:transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, opacity 0.2s;
         -webkit-tap-highlight-color:transparent}
  button:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 6px 20px rgba(37,99,185,0.45)}
  button:active{transform:translateY(1px) scale(0.96);box-shadow:0 2px 8px rgba(37,99,185,0.3)}
  button:disabled{opacity:.6;transform:none;box-shadow:none;cursor:not-allowed}

  /* Ripple no clique do botao */
  span.ripple {
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    animation: rippleEffect 0.55s linear;
    background-color: rgba(255, 255, 255, 0.35);
    pointer-events: none;
  }
  @keyframes rippleEffect {
    to { transform: scale(4); opacity: 0; }
  }

  /* Toast com bounce spring */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px) scale(0.85);
         opacity:0;background:#222;color:#fff;padding:13px 22px;border-radius:30px;font-size:14.5px;
         font-weight:500;box-shadow:0 8px 26px rgba(0,0,0,.3);
         max-width:88%;text-align:center;z-index:99999;
         pointer-events:none;
         transition:transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;}
  .toast.show{
    transform:translateX(-50%) translateY(0) scale(1);
    opacity:1;
    animation: toastBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes toastBounce {
    0% { transform: translateX(-50%) translateY(60px) scale(0.75); opacity: 0; }
    65% { transform: translateX(-50%) translateY(-8px) scale(1.04); opacity: 1; }
    85% { transform: translateX(-50%) translateY(2px) scale(0.98); opacity: 1; }
    100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
  }
  .toast.ok{background:var(--verde)} .toast.err{background:var(--vermelho)}

  .hint{color:#AFC4F0;font-size:12px;text-align:center;margin-top:14px}
  .sync-info{color:#AFC4F0;font-size:11px;text-align:center;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">$</div><h1>Novo Lançamento</h1></div>
  <div class="card">
    <label>Data</label>
    <input type="date" id="data">

    <label>Descrição</label>
    <div class="desc-wrap">
      <div class="desc-row">
        <input type="text" id="descSearch" placeholder="Buscar descrição..."
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="desc-clear" id="descClear">&#x2715;</div>
      </div>
      <div class="drop" id="drop"></div>
      <div class="desc-hint info" id="descHint">Digite para buscar</div>
    </div>
    <input type="hidden" id="descVal">

    <label>Valor</label>
    <div class="moeda">
      <span id="moedaSymbol">R$</span>
      <input type="text" id="valor" inputmode="numeric" placeholder="0,00" readonly>
    </div>

    <button id="btn">Adicionar lançamento</button>
  </div>
  <div class="hint">Os lançamentos entram na planilha quando você tocar em "Sincronizar" no Excel.</div>
  <div class="sync-info" id="syncInfo"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEtmEH4MMdUjvGTK7e6J_Q297wRSlhHj9byteeOMNBcFwpiAK94DnNgHTSt9W1zqUc/exec";
const TOKEN      = "3380";

let LISTA = ["Acessório", "Ajuda de custo", "Almoço", "Aluguel", "Assinaturas", "Ações", "Besteiras", "Cabelo", "Café da manhã", "Casa", "Churrasco", "Combustivel", "Compra Mercado Livre", "Cursos", "Dividendos", "Dizimo", "Dízimo", "Eletrônicos", "Estacionamento", "Eventos", "Extorno", "Extra", "FII´s", "Facul", "Farmácia", "Fatura", "Hora Extra", "Jogos", "Juros", "Kart", "Lanche", "Lavação", "Luz", "Manut. Carro", "Mecânico", "Mercado", "Microsoft One Drive", "Outros", "Pag. Cartão crédito", "Pc", "Pedágio", "Perfume", "Peças carro", "Pizza", "Projetos", "RU", "Renda Extra", "Renda Fixa", "Restaurante", "Retiro", "Roupa", "Saldo Inicial", "Salário", "Saída", "Softwares", "Sorvete", "Tênis", "Venda", "Venda de ação", "Volêi", "Água"];

const $id = id => document.getElementById(id);

// ---- helper de animacao bounce/pop ----
function triggerBounce(el, className = 'bounce-pop') {
  if(!el) return;
  el.classList.remove(className);
  void el.offsetWidth; // forcar reflow
  el.classList.add(className);
}

// Logo clicável com bounce
const logoEl = document.querySelector('.logo');
if(logoEl){
  logoEl.addEventListener('click', () => triggerBounce(logoEl, 'bounce'));
}

// ---- toast ----
const toast = (msg, tipo) => {
  const t=$id('toast'); t.textContent=msg;
  t.className='toast show '+(tipo||'');
  setTimeout(()=>t.className='toast '+(tipo||''), 2800);
};

// ---- data padrao = hoje ----
(()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); $id('data').value=d.toISOString().slice(0,10); })();

// ---- busca descricoes no servidor ----
async function carregarDescricoes(){
  try{
    const r=await fetch(SCRIPT_URL+'?token='+TOKEN+'&tipo=descricoes',{redirect:'follow'});
    const txt=await r.text();
    if(!txt||txt.startsWith('ERRO')) return;
    const nova=txt.split('\n').map(s=>s.trim()).filter(Boolean);
    if(nova.length){ LISTA=nova; $id('syncInfo').textContent='Descrições atualizadas ('+nova.length+')'; }
  }catch(e){}
}
carregarDescricoes();

// ================================================================
//  CAMPO DE BUSCA COM DROPDOWN FIXO (nao treme ao rolar)
// ================================================================
const searchEl = $id('descSearch');
const dropEl   = $id('drop');
const descVal  = $id('descVal');
const descHint = $id('descHint');
let dropAberto = false;
let touchMoving = false;

// ---- Funcao para sincronizar as cores do input e do botao X ----
function setDescState(state){
  const clr = $id('descClear');
  if(state === 'ok'){
    searchEl.className = 'ok';
    clr.className = 'desc-clear clear-ok';
  } else if(state === 'err'){
    searchEl.className = 'err';
    clr.className = 'desc-clear clear-err';
  } else {
    searchEl.className = '';
    clr.className = 'desc-clear';
  }
}

function normaliza(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function hl(txt,q){
  if(!q) return txt;
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return txt.replace(re,'<em>$1</em>');
}

function posicionarDrop(){
  dropEl.style.left = '';
  dropEl.style.top = '';
  dropEl.style.width = '';
}

function abrirDrop(q){
  const nq=normaliza(q);
  const fil=nq ? LISTA.filter(d=>normaliza(d).includes(nq)) : LISTA;
  if(!fil.length){
    dropEl.innerHTML='<div class="drop-empty">Nenhuma descrição encontrada</div>';
  } else {
    dropEl.innerHTML=fil.slice(0,40).map(d=>
      '<div class="drop-item" data-v="'+d.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+hl(d,q)+'</div>'
    ).join('');
  }
  posicionarDrop();
  if(!dropAberto){
    triggerBounce(dropEl, 'drop-spring');
  }
  dropEl.classList.add('open');
  dropAberto=true;
}

function fecharDrop(){ dropEl.classList.remove('open'); dropAberto=false; }

function selecionarItem(v){
  searchEl.value=v; descVal.value=v;
  setDescState('ok');
  descHint.className='desc-hint ok'; descHint.textContent='✓ Cadastrada';
  triggerBounce(searchEl, 'bounce-pop');
  triggerBounce($id('descClear'), 'bounce-pop');
  fecharDrop();
}

function limparDesc(){
  searchEl.value=''; descVal.value='';
  setDescState('');
  descHint.className='desc-hint info'; descHint.textContent='Digite para buscar';
  triggerBounce($id('descClear'), 'clear-spin');
  fecharDrop(); searchEl.focus();
}

// reposiciona o drop se a pagina rolar (sem fechar)
window.addEventListener('scroll', ()=>{ if(dropAberto) posicionarDrop(); }, {passive:true});
window.addEventListener('resize', ()=>{ if(dropAberto) posicionarDrop(); });

searchEl.addEventListener('focus',()=>abrirDrop(searchEl.value));
searchEl.addEventListener('input',()=>{
  descVal.value=''; 
  setDescState('');
  descHint.className='desc-hint info'; descHint.textContent='';
  abrirDrop(searchEl.value);
});
searchEl.addEventListener('blur',()=>{
  // pequeno delay para o touchstart do item disparar antes
  setTimeout(()=>{
    fecharDrop();
    if(searchEl.value && !descVal.value){
      const match=LISTA.find(d=>d.toLowerCase()===searchEl.value.toLowerCase());
      if(match){ selecionarItem(match); }
      else{
        setDescState('err');
        descHint.className='desc-hint err';
        descHint.textContent='Não cadastrada — use "Nova Categoria" no Excel';
      }
    }
  }, 200);
});

// delegar eventos nos itens do drop
dropEl.addEventListener('touchstart', e=>{
  touchMoving=false;
  const item=e.target.closest('.drop-item');
  if(item) item.classList.add('active');
}, {passive:true});

dropEl.addEventListener('touchmove', e=>{
  touchMoving=true;
  // remove highlight se comecar a rolar
  dropEl.querySelectorAll('.drop-item.active').forEach(el=>el.classList.remove('active'));
}, {passive:true});

dropEl.addEventListener('touchend', e=>{
  if(touchMoving) return; // estava rolando, nao seleciona
  const item=e.target.closest('.drop-item');
  if(item && item.dataset.v){ e.preventDefault(); selecionarItem(item.dataset.v); }
}, {passive:false});

dropEl.addEventListener('mousedown', e=>{
  const item=e.target.closest('.drop-item');
  if(item && item.dataset.v){ e.preventDefault(); selecionarItem(item.dataset.v); }
});

$id('descClear').addEventListener('touchstart', e=>{ e.preventDefault(); limparDesc(); },{passive:false});
$id('descClear').addEventListener('click', limparDesc);

document.addEventListener('touchstart', e=>{
  if(!searchEl.contains(e.target) && !dropEl.contains(e.target) && !$id('descClear').contains(e.target))
    fecharDrop();
},{passive:true});

// ================================================================
//  CAMPO VALOR ESTILO BANCO
// ================================================================
let centavos = 0;
const valorEl = $id('valor');

function animarDigitacaoValor() {
  triggerBounce(valorEl, 'bounce-pop');
  triggerBounce($id('moedaSymbol'), 'symbol-bounce');
}

function formatarValor(c){
  const s = String(c).padStart(3,'0');
  const reais = s.slice(0,-2).replace(/^0+/,'')||'0';
  const cents = s.slice(-2);
  // separador de milhar
  const r = reais.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return r+','+cents;
}

// teclado numerico — captura toques
document.addEventListener('keydown', e=>{
  if(document.activeElement !== valorEl) return;
  if(e.key>='0' && e.key<='9'){
    if(centavos < 9999999) centavos = centavos*10 + parseInt(e.key);
    valorEl.value = formatarValor(centavos);
    animarDigitacaoValor();
  } else if(e.key==='Backspace'){
    centavos = Math.floor(centavos/10);
    valorEl.value = formatarValor(centavos);
    animarDigitacaoValor();
  }
  e.preventDefault();
});

// no celular o input e readonly entao abrimos o teclado com um campo auxiliar oculto
const valorAux = document.createElement('input');
valorAux.type='tel'; valorAux.style.cssText='position:fixed;opacity:0;top:0;left:0;width:1px;height:1px;';
document.body.appendChild(valorAux);

function atualizarEstadoValor(){
  valorEl.classList.add('ativo');
}
valorEl.addEventListener('click',()=>{ 
  centavos=0; 
  valorEl.value='0,00'; 
  valorAux.focus(); 
  valorEl.classList.add('ativo'); 
  animarDigitacaoValor();
});
valorEl.addEventListener('focus',()=>{ valorAux.focus(); valorEl.classList.add('ativo'); });
valorAux.addEventListener('blur',()=>{ valorEl.classList.remove('ativo'); });

valorAux.addEventListener('input', e=>{
  // pega so os digitos digitados
  const digitos=(valorAux.value||'').replace(/\D/g,'');
  if(digitos.length > 0){
    for(const d of digitos){
      if(centavos < 9999999) centavos = centavos*10 + parseInt(d);
    }
    valorEl.value=formatarValor(centavos);
    atualizarEstadoValor();
    animarDigitacaoValor();
  }
  valorAux.value='';
});
valorAux.addEventListener('keydown',e=>{
  if(e.key==='Backspace'){ 
    centavos=Math.floor(centavos/10); 
    valorEl.value=formatarValor(centavos); 
    atualizarEstadoValor(); 
    animarDigitacaoValor();
  }
});

// ================================================================
//  ENVIAR E RIPPLE EFFECT
// ================================================================
$id('btn').addEventListener('click', function(e) {
  // Ripple
  const btn = this;
  const circle = document.createElement('span');
  const diameter = Math.max(btn.clientWidth, btn.clientHeight);
  const radius = diameter / 2;
  const rect = btn.getBoundingClientRect();
  circle.style.width = circle.style.height = `${diameter}px`;
  circle.style.left = `${e.clientX - rect.left - radius}px`;
  circle.style.top = `${e.clientY - rect.top - radius}px`;
  circle.classList.add('ripple');
  const prevRipple = btn.querySelector('.ripple');
  if (prevRipple) prevRipple.remove();
  btn.appendChild(circle);
});

$id('btn').addEventListener('click', async ()=>{
  const data  = $id('data').value;
  const desc  = descVal.value.trim();
  const valor = centavos/100;

  if(!data){ 
    toast('Escolha a data','err'); 
    triggerBounce($id('data'), 'bounce-pop');
    return; 
  }
  if(!desc){
    if(searchEl.value.trim()){
      setDescState('err');
      descHint.className='desc-hint err';
      descHint.textContent='Selecione uma opção da lista';
    }
    toast('Selecione uma descrição da lista','err'); 
    triggerBounce(searchEl, 'bounce-pop');
    return;
  }
  if(valor<=0){ 
    toast('Digite um valor válido','err'); 
    animarDigitacaoValor();
    return; 
  }

  $id('btn').disabled=true; $id('btn').textContent='Enviando...';
  try{
    await fetch(SCRIPT_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:TOKEN,data:data,descricao:desc,valor:valor})
    });
    toast('\u2713 Lançado: '+desc,'ok');
    if(logoEl) triggerBounce(logoEl, 'bounce');
    limparDesc();
    centavos=0; valorEl.value='0,00'; valorEl.classList.remove('ativo');
    searchEl.focus();
  }catch(err){
    toast('Erro de conexão. Tente de novo.','err');
  }finally{
    $id('btn').disabled=false; $id('btn').textContent='Adicionar lançamento';
  }
});
</script>
</body>
</html>
